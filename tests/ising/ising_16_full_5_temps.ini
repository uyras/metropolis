[main]
file = ising_16.mfsys
heatup = 1000
calculate = 1000
range = 1.01
seed = 123
temperature = 1.0, 2, 2.264, 3, 5
field = 0|0|0 ; add external field
size = 4|4
restart = 1 ; restart the program if found lower energy. Default is 1.
restartthreshold = 1e-6 ; minimal difference between the initial and lower energy, in relative to initial energy units. Default is 1e-6.
savegs = ising_100_gs.mfsys ; if defined, the resulting GS will be saved to this file
binder = 1 ; если 1, то считать кумулянты 4 порядка для всех параметров

[magnetisationlength:ml]

[magnetisationlength:mls]
spins = 1,3,4

[magnetisation:m]
axis = z

[magnetisation:m_abs]
axis = z
module = 1

[magnetisation:m_odd]
axis = z
spins = 1, 3, 4, 6, 9, 11, 12, 14

[magnetisation:m_even]
axis = z
spins = 0, 2, 5, 7, 8, 10, 13, 15

[magnetisation:m_odd_abs]
axis = z
spins = 1, 3, 4, 6, 9, 11, 12, 14
module = 1

[magnetisation:m_even_abs]
axis = z
spins = 0, 2, 5, 7, 8, 10, 13, 15
module = 1

[correlation:AB] ; parameter type: correlation, id: AB
method = xor,scalar,energy ; this will create three parameters with different methods
minrange = 0.9
maxrange = 1.001

[correlation:AC] ; parameter type: correlation, id: AB
method = xor,scalar,energy ; this will create three parameters with different methods
minrange = 1.2
maxrange = 2

[correlation:AD] ; parameter type: correlation, id: AB
method = xor,scalar,energy ; this will create three parameters with different methods
minrange = 2.001
maxrange = 4
spins = 1,3,5

[correlationpoint:cp]
points = 0.5|0.5, 2.5|2.5
distance = 0.75
minrange = 0
maxrange = 1.001